name: Sync Model Pricing

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-model-pricing
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh bundled model pricing
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh pricing snapshot
        run: npm run sync:model-pricing

      - name: Run checks
        run: npm run check

      - name: Detect pricing changes
        id: pricing
        run: |
          set -euo pipefail
          if git diff --quiet -- src/usage/modelPricing.generated.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Gateway pricing is unchanged."
          else
            git diff --check -- src/usage/modelPricing.generated.ts
            git diff --stat -- src/usage/modelPricing.generated.ts
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pricing pull request
        if: steps.pricing.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_branch="${{ github.event.repository.default_branch }}"
          snapshot_file="$RUNNER_TEMP/modelPricing.generated.ts"
          cp src/usage/modelPricing.generated.ts "$snapshot_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing_branch="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base "$base_branch" \
              --state open \
              --json headRefName,isCrossRepository \
              --jq '([.[] | select(.isCrossRepository == false and (.headRefName | startswith("automation/model-pricing-")))] | first | .headRefName) // ""'
          )"

          if [ -n "$existing_branch" ]; then
            target_branch="$existing_branch"
            git fetch origin "refs/heads/$target_branch:refs/remotes/origin/$target_branch"
            git switch --create "$target_branch" --track "origin/$target_branch"
            git merge --no-edit "origin/$base_branch"
          else
            target_branch="automation/model-pricing-$GITHUB_RUN_ID"
            git switch --create "$target_branch" "origin/$base_branch"
          fi

          cp "$snapshot_file" src/usage/modelPricing.generated.ts
          git add src/usage/modelPricing.generated.ts
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "chore: update model pricing snapshot"
          fi
          git push origin "HEAD:refs/heads/$target_branch"

          if [ -z "$existing_branch" ]; then
            pr_body="$RUNNER_TEMP/model-pricing-pr.md"
            printf '%s\n' \
              'Automated refresh of the bundled Vercel AI Gateway model pricing snapshot.' \
              '' \
              '@zzgosh, please review these pricing changes before merging.' \
              '' \
              'Validation:' \
              '- `npm run check`' > "$pr_body"
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$base_branch" \
              --head "$target_branch" \
              --title "chore: update model pricing snapshot" \
              --body-file "$pr_body"
          fi
